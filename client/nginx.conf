
server {
    listen 5173 ssl;
    server_name localhost;

    # Certificates generated in a non-root writable directory.
    ssl_certificate     /tmp/hustlehub-certs/localhost-cert.pem;
    ssl_certificate_key /tmp/hustlehub-certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the static frontend.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
