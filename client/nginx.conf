server {
    listen 5173 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost-cert.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    # The served bundle is static, so these headers are set here rather than
    # by Helmet, which only protects API responses.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    # nginx should not advertise its version.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.html;
    }
}